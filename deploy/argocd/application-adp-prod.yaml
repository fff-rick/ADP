apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adp
  namespace: argocd
spec:
  project: adp
  source:
    repoURL: https://github.com/fff-rick/ADP.git
    targetRevision: main
    path: deploy/k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: adp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
