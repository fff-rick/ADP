name: ADP CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  SERVER_IMAGE: adp-server

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          args: --config=.golangci.yml

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  build-and-publish:
    needs:
      - lint
      - test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        id: image
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          repository="ghcr.io/${owner}/${SERVER_IMAGE}"
          tag="${GITHUB_SHA::12}"
          echo "repository=${repository}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REPOSITORY=${repository}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${tag}" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: |
            ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}

      - name: Pin deployment image digest
        working-directory: deploy/k8s/overlays/prod
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("kustomization.yaml")
          server = os.environ["IMAGE_REPOSITORY"]
          digest = os.environ["IMAGE_DIGEST"]
          if not digest.startswith("sha256:"):
              raise SystemExit(f"unexpected image digest: {digest!r}")

          lines = path.read_text().splitlines()
          active = ""
          digest_updated = False
          for i, line in enumerate(lines):
              stripped = line.strip()
              if stripped.startswith("- name: ") and stripped.endswith("/adp-server"):
                  active = "server"
              elif stripped.startswith("- name: "):
                  active = ""
              elif active == "server" and stripped.startswith("newName: "):
                  lines[i] = f"    newName: {server}"
              elif active == "server" and stripped.startswith("newTag: "):
                  lines[i] = f"    digest: {digest}"
                  digest_updated = True
              elif active == "server" and stripped.startswith("digest: "):
                  lines[i] = f"    digest: {digest}"
                  digest_updated = True

          if not digest_updated:
              raise SystemExit("adp-server image entry has no newTag or digest field")

          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Commit deployment manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/overlays/prod/kustomization.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "deploy: adp ${IMAGE_DIGEST:7:12} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
