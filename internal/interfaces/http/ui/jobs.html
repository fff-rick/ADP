<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ADP Jobs</title><link rel="stylesheet" href="/static/app.css"></head>
<body data-page="jobs"><div class="ambient-glow"></div><div class="shell" style="position:relative;z-index:1;"><header class="topbar"><div class="topbar-brand">Jobs<em>Controlled Operations</em></div><div class="topbar-right"><span class="server-clock" id="clock">--:--:--</span><a href="/login" class="btn btn-xs btn-primary" id="login-nav-btn" style="display:none;">登录</a><span class="session-badge" id="session-state">未登录</span><button id="logout-button" class="btn btn-xs btn-ghost" style="display:none;">退出</button><button class="theme-toggle" id="theme-toggle" type="button">◐</button></div></header>
<nav class="nav" style="margin-bottom:28px;"><a class="nav-link" href="/">首页</a><a class="nav-link" href="/users">用户</a><a class="nav-link" href="/workers">Workers</a><a class="nav-link is-active" href="/jobs">Jobs</a><a class="nav-link" href="/tasks">Agent</a><a class="nav-link" href="/configs">配置</a></nav>
<main><div class="page-grid scroll-reveal stagger-1">
  <!-- 手动创建 Job -->
  <div class="panel-shell" style="grid-row:span 2;"><div class="panel-core">
    <div class="panel-heading"><span class="panel-index">手动</span><span class="panel-title">创建 Job</span><span class="panel-subtitle">模板模式或 Shell 命令模式</span></div>
    <form id="job-form" class="form-stack">
      <!-- 模式切换 -->
      <div style="display:flex;gap:10px;margin-bottom:4px;">
        <button type="button" class="btn btn-xs btn-primary" id="mode-template-btn" onclick="switchJobMode('template')" style="flex:1;">模板模式</button>
        <button type="button" class="btn btn-xs btn-ghost" id="mode-shell-btn" onclick="switchJobMode('shell')" style="flex:1;">Shell 命令</button>
      </div>
      <div class="field-group"><label class="field-label" for="job-name">任务名</label><input class="field-input" id="job-name" name="job-name" type="text" placeholder="例如：检查 nginx 端口"></div>
      <!-- 模板模式区域 -->
      <div id="template-section">
        <div class="field-group"><label class="field-label" for="job-template">模板 <span style="color:var(--text-tertiary);font-size:.75rem;">(可选)</span></label><select class="field-input" id="job-template" name="job-template"><option value="">直接输入命令（跳过模板）…</option></select></div>
        <div id="job-params-container"></div>
      </div>
      <!-- Shell 命令区域 -->
      <div class="field-group">
        <label class="field-label" for="job-command">命令</label>
        <textarea class="field-textarea mono" id="job-command" rows="4" placeholder="例如：curl -sI https://github.com | head -5"></textarea>
      </div>
      <div class="field-group"><label class="field-label" for="job-worker">目标 Worker</label><select class="field-input" id="job-worker" name="job-worker"><option value="">选择 Worker…</option></select></div>
      <div id="job-worker-type-group" class="field-group" style="display:none;"><label class="field-label" for="job-worker-type-inp">Worker Type</label><input class="field-input" id="job-worker-type-inp" value="shell" placeholder="shell"></div>
      <button class="btn btn-primary" type="submit" id="job-submit-btn">创建并下发</button>
    </form>
  </div></div>
  <!-- 审批 -->
  <div class="panel-shell"><div class="panel-core"><div class="panel-heading"><span class="panel-index">审批</span><span class="panel-title">待审批</span></div><div id="approval-list"></div></div></div>
  <!-- Job 列表 -->
  <div class="panel-shell"><div class="panel-core"><div class="panel-heading"><span class="panel-index">列表</span><span class="panel-title">Job</span></div><div id="job-list"></div></div></div>
</div></main>
</div><div id="toast" class="toast" hidden></div><script src="/static/app.js" defer></script></body></html>
