<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ADP Agent</title><link rel="stylesheet" href="/static/app.css"></head>
<body data-page="tasks"><div class="ambient-glow"></div><div class="shell" style="position:relative;z-index:1;">
<header class="topbar"><div class="topbar-brand">Agent<em>Conversation</em></div><div class="topbar-right"><span class="server-clock" id="clock">--:--:--</span><a href="/login" class="btn btn-xs btn-primary" id="login-nav-btn" style="display:none;">登录</a><span class="session-badge" id="session-state">未登录</span><button id="logout-button" class="btn btn-xs btn-ghost" style="display:none;">退出</button><button class="theme-toggle" id="theme-toggle" type="button" title="切换主题">◐</button></div></header>
<nav class="nav" style="margin-bottom:28px;"><a class="nav-link" href="/">首页</a><a class="nav-link" href="/users">用户</a><a class="nav-link" href="/workers">Workers</a><a class="nav-link" href="/jobs">Jobs</a><a class="nav-link is-active" href="/tasks">Agent</a><a class="nav-link" href="/knowledge">知识库</a><a class="nav-link" href="/configs">配置</a></nav>
<main>
<div style="display:grid;grid-template-columns:240px 1fr;gap:20px;min-height:70vh;">
  <!-- 左侧：对话列表 -->
  <div class="panel-shell"><div class="panel-core" style="display:flex;flex-direction:column;height:100%;">
	    <div class="panel-heading"><span class="panel-index">对话</span><span class="panel-title">历史</span></div>
	    <div class="agent-safety-card" aria-label="Agent 安全边界"><strong>受控执行</strong><span>仅已注册模块</span><span>Shell 永久关闭</span><span>历史案例仅供参考，不是实时事实</span><span>事件已脱敏 / 限长</span></div>
    <button class="btn btn-primary btn-xs" id="new-conv-btn" style="margin-bottom:12px;width:100%;" onclick="startNewConversation()">+ 新对话</button>
    <div id="conversation-list" style="flex:1;overflow-y:auto;font-size:.8125rem;"></div>
    <div class="run-monitor" id="agent-run-monitor" aria-live="polite">
      <div class="run-monitor-heading"><span>运行账本</span><button class="btn btn-xs btn-ghost" id="run-replay-button" type="button" disabled>重放事件</button></div>
      <div id="agent-run-summary" class="run-monitor-empty">提交任务后显示状态、追踪信息与恢复进度。</div>
      <div id="agent-run-events" class="run-event-list"></div>
    </div>
  </div></div>
  <!-- 右侧：对话内容 -->
  <div class="panel-shell"><div class="panel-core" style="display:flex;flex-direction:column;height:100%;">
    <div class="panel-heading"><span class="panel-index" id="conv-title-index">Agent</span><span class="panel-title" id="conv-title-text">新对话</span><span class="panel-subtitle" id="conv-subtitle">受控工具调用 · 可恢复执行</span></div>
    <div id="conversation-messages" style="flex:1;overflow-y:auto;padding:8px 0;font-size:.8125rem;max-height:50vh;"></div>
    <form id="task-form" class="form-stack" style="margin-top:12px;border-top:1px solid var(--border);padding-top:12px;">
      <div class="field-group"><textarea class="field-textarea" id="task-input" rows="3" placeholder="输入运维指令，例如：检查 worker-1 的磁盘使用情况"></textarea></div>
      <div style="display:flex;gap:8px;"><button class="btn btn-primary" type="submit">运行 Agent</button><span id="agent-running-indicator" style="display:none;align-items:center;gap:6px;font-size:.75rem;color:var(--accent);"><span class="status-dot" style="background:var(--accent);animation:pulse 1s infinite;"></span>运行中…</span></div>
    </form>
  </div></div>
</div>
<!-- Agent 创建的任务列表 -->
	<div class="panel-shell scroll-reveal" style="margin-top:20px;"><div class="panel-core">
  <div class="panel-heading"><span class="panel-index">执行</span><span class="panel-title">Agent 创建的任务</span></div>
  <div id="task-list"></div>
	</div></div>
	<div class="panel-shell scroll-reveal" style="margin-top:20px;"><div class="panel-core">
	  <div class="panel-heading"><span class="panel-index">Safety</span><span class="panel-title">安全与评测闭环</span><span class="panel-subtitle">模型、Prompt、工具或策略变更均需执行回归评测</span></div>
	  <div class="agent-safety-grid"><div><strong>25 条</strong><span>确定性安全评测</span></div><div><strong>注册模块</strong><span>禁止 raw shell / SQL / YAML / 文件工具</span></div><div><strong>真实证据</strong><span>报告通过已持久化工具结果回放核验</span></div></div>
	</div></div>
</main>
</div><div id="toast" class="toast" hidden></div><script src="/static/app.js" defer></script></body></html>
