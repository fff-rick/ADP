id: diagnosis_analyzer
name: 默认诊断分析规则
rules:
  - trigger_type: nginx_unreachable
    fault_type: Nginx 服务异常
    possible_causes: [Nginx 进程、端口监听或网络访问可能异常]
    suggestions: [检查进程状态、监听端口、错误日志和网络策略]
    confidence: 0.5
  - trigger_type: redis_slow
    fault_type: Redis 响应慢
    possible_causes: [Redis 内存、慢查询或客户端连接数可能异常]
    suggestions: [检查内存指标、慢日志和连接池配置]
    confidence: 0.5
