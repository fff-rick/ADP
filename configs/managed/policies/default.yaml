id: default
name: Default execution policy
blocked_tools:
  - rm
  - dd
  - mkfs
  - fdisk
  - shutdown
  - reboot
  - halt
  - poweroff
  - kill
  - killall
  - pkill
  - chmod
  - chown
  - passwd
  - useradd
  - userdel
  - groupadd
  - iptables
  - ip6tables
allowed_templates:
  - mysql_backup
  - mysql_query
  - http_health_check
  - check_process
  - check_port
  - read_log_tail
  - redis_ping
  - redis_info
  - redis_slowlog_get
  - redis_client_list
  - host_diagnostics
  - restart_service
  - service_status
  - reload_service
  - disk_usage_check
high_risk_keywords:
  - delete
  - drop
  - restart
  - reboot
  - shutdown
  - kill
  - "rm "
  - mkfs
  - "dd "
  - "systemctl stop"
  - "systemctl disable"
  - "systemctl mask"
  - "> /dev/"
