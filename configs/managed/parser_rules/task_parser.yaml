id: task_parser
name: Default task parser rules
rules:
  - pattern: '(github|github\.com).*(连通|连接|可达|访问|检查|检测)|(连通|连接|可达|访问|检查|检测).*(github|github\.com)'
    intent: health_check
    target_type: http_service
    risk_level: low
    matched_template: http_health_check
    parameters:
      URL: https://github.com
      Timeout: "10"
  - pattern: '(mysql|数据库|mariadb).*(备份|backup|dump)|(备份|backup|dump).*(mysql|数据库|mariadb)'
    intent: create_scheduled_backup
    target_type: mysql
    risk_level: medium
    matched_template: mysql_backup
    parameters:
      Database: mydb
      ServiceType: mysql
      Host: 127.0.0.1
      Port: "3306"
      OutputFile: /tmp/backup.sql
  - pattern: '(nginx).*(不可用|无法访问|诊断|排查|故障|问题|日志|错误|进程|运行)'
    intent: diagnose
    target_type: nginx
    risk_level: low
    parameters:
      ServiceType: nginx
  - pattern: '(redis).*(慢|slow|性能|诊断|响应|排查|日志|log)'
    intent: diagnose
    target_type: redis
    risk_level: low
    parameters:
      ServiceType: redis
  - pattern: '(日志|log|tail).*(redis|nginx|获取|查看|读取|get)|(获取|查看|读取|get).*(日志|log)'
    intent: read_logs
    target_type: log_file
    risk_level: low
    matched_template: read_log_tail
    parameters:
      LogFile: /var/log/syslog
      Lines: "50"
  - pattern: '健康检查|health.?check|(检查|检测).*(http|网站|服务|url)|(http|网站|服务|url).*(检查|检测|可用|存活)'
    intent: health_check
    target_type: http_service
    risk_level: low
    matched_template: http_health_check
    parameters:
      URL: http://127.0.0.1:80
      Timeout: "10"
