code: redis_slowlog_get
name: Redis 慢日志
tool_type: shell
command: redis-cli -h {{.Host}} -p {{.Port}} SLOWLOG GET {{.Count}}
risk_level: low
parameters: [{name: ServiceProfile, required: true}, {name: ServiceType, required: true, default: redis}, {name: Host, required: true}, {name: Port, required: true}, {name: Count, required: false, default: "10"}]
