id: shell
name: Shell templates
templates:
  - code: check_port
    name: 端口监听检查
    description: 检查端口监听状态。
    tool_type: shell
    command: |
      if command -v ss >/dev/null 2>&1; then
        ss -tlnp 2>/dev/null | grep -F -- ":{{.Port}}" || true
      elif command -v netstat >/dev/null 2>&1; then
        netstat -tlnp 2>/dev/null | grep -F -- ":{{.Port}}" || true
      else
        echo "neither ss nor netstat is available" >&2
        exit 127
      fi
    risk_level: low
    parameters:
      - {name: ServiceProfile, description: Worker 本地服务配置, required: true}
      - {name: Port, description: 端口号, required: true}
  - code: check_process
    name: 进程存活检查
    description: 检查指定进程。
    tool_type: shell
    command: ps aux | grep -v grep | grep -F -- "{{.ProcessName}}" || true
    risk_level: low
    parameters:
      - {name: ServiceProfile, description: Worker 本地服务配置, required: true}
      - {name: ProcessName, description: 进程名称, required: true}
  - code: disk_usage_check
    name: 磁盘使用检查
    description: 检查路径的磁盘使用情况。
    tool_type: shell
    command: df -h {{.Path}}
    risk_level: low
    parameters:
      - {name: Path, description: 检查路径, required: false, default: /}
  - code: http_health_check
    name: HTTP 健康检查
    description: 检查 URL 是否可访问。
    tool_type: shell
    command: curl -s -o /dev/null -w '%{http_code}' --max-time {{.Timeout}} {{.URL}}
    risk_level: low
    parameters:
      - {name: ServiceProfile, description: Worker 本地服务配置, required: true}
      - {name: URL, description: 检查地址, required: true}
      - {name: Timeout, description: 超时秒数, required: false, default: "10"}
  - code: read_log_tail
    name: 日志尾部读取
    description: 读取日志文件末尾。
    tool_type: shell
    command: tail -{{.Lines}} {{.LogFile}}
    risk_level: low
    parameters:
      - {name: ServiceProfile, description: Worker 本地服务配置, required: true}
      - {name: LogFile, description: 日志文件, required: true}
      - {name: Lines, description: 行数, required: false, default: "50"}
  - code: host_diagnostics
    name: 主机诊断
    description: 收集主机 CPU、内存、磁盘、进程、网络等诊断信息。
    tool_type: shell
    command: |
      echo "=== HOSTNAME ===" && hostname
      echo "=== UPTIME ===" && uptime
      echo "=== CPU ===" && top -bn1 | head -5
      echo "=== MEMORY ===" && free -m
      echo "=== DISK ===" && df -h
      echo "=== PROCESSES (top 15) ===" && ps aux --sort=-%mem | head -15
      echo "=== LISTENING PORTS ===" && ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null
    risk_level: low
    parameters: []
