id: yaml_generator
name: YAML 生成规则
rules:
  - keywords: [mysql 备份, 数据库备份, backup mysql]
    name: MySQL 数据库备份
    worker_type: shell
    workers: [all]
    tasks:
      - name: 备份 MySQL
        template: mysql_backup
        parameters: {Database: mydb, ServiceProfile: mysql_prod, ServiceType: mysql}
  - keywords: [nginx, 网站不可用]
    name: Nginx 诊断
    worker_type: shell
    workers: [all]
    tasks:
      - {name: 检查进程, template: check_process, parameters: {ServiceProfile: nginx_prod, ServiceType: nginx}}
      - {name: 检查端口, template: check_port, parameters: {ServiceProfile: nginx_prod, ServiceType: nginx}}
      - {name: 健康检查, template: http_health_check, parameters: {ServiceProfile: adp_http, ServiceType: http}}
  - keywords: [redis, 缓存变慢]
    name: Redis 诊断
    worker_type: shell
    workers: [all]
    tasks:
      - {name: PING, template: redis_ping, parameters: {ServiceProfile: redis_prod, ServiceType: redis}}
      - {name: 内存信息, template: redis_info, parameters: {ServiceProfile: redis_prod, ServiceType: redis}}
      - {name: 慢查询, template: redis_slowlog_get, parameters: {ServiceProfile: redis_prod, ServiceType: redis, Count: "10"}}
